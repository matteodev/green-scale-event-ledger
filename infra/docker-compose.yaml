services:
  # --- EMULATORE AWS (LOCALSTACK COMMUNITY) ---
  localstack:
    container_name: green_scale_localstack
    # Blocchiamo la versione alla v3 stabile per escludere i bug di licenza della v4/latest
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=eu-west-1
      - DEPLOY_PRO=0
      - PERSISTENCE=0              # Evita i salvataggi di stato pro su disco locale
    volumes:
      - ./init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh
    networks:
      - green_scale_network

  # --- DATABASE RELAZIONALE + VETTORIALE (POSTGRES + PGVECTOR) ---
  postgres:
    container_name: green_scale_postgres
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=green_scale_ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - green_scale_network

  # --- CACHE & DEDUPLICAZIONE (REDIS) ---
  redis:
    container_name: green_scale_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - green_scale_network

volumes:
  postgres_data:
  redis_data:

networks:
  green_scale_network:
    driver: bridge
